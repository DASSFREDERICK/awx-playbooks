---
- name: Test Local Playbook Execution
  hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
    - name: Display a greeting and system info
      ansible.builtin.debug:
        msg: "Hello from AWX! The target system hostname is {{ ansible_hostname }}"

    - name: Run a simple shell command
      ansible.builtin.shell: uptime
      register: uptime_result

    - name: Show uptime output
      ansible.builtin.debug:
        msg: "{{ uptime_result.stdout }}"

